version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: igpoc
      POSTGRES_PASSWORD: igpoc
      POSTGRES_DB: igpoc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema is no longer auto-applied here — run `alembic upgrade head`
      # after the container is up (see README). Keeping schema.sql around
      # under sql/ purely as a human-readable reference of the current
      # shape; alembic/versions/ is the actual source of truth now.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U igpoc"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.9
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "9092:9092"     # internal listener — used by other containers (e.g. redpanda-console)
      - "19092:19092"   # external listener — use THIS one from host-run Python processes
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.6.0
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      - redpanda

volumes:
  pgdata:
  pgadmin-data:
  redpanda_data: